# Aegis — Mode A (all-in-one): one entrypoint that brings up the modular
# components in a single Docker Compose project:
#   base infrastructure (PostgreSQL/Redis/ClickHouse) + DNS plane + control
#   plane (API/dashboard) + edge + dev extras.
#
# These are the *same* service definitions used in modular mode — this file only
# aggregates them. See deploy/compose/README.md for operating components
# individually (Mode B).
name: aegis

include:
  - deploy/compose/base.yml
  - deploy/compose/dns.yml
  - deploy/compose/control-plane.yml
  - deploy/compose/edge.yml
  - deploy/compose/dev.yml
